name: Test & Deploy Meerut-Mart Backend Worker to Cloudflare

on:
  push:
    branches:
      - main
      - cloudflare-migration
  workflow_dispatch:

jobs:
  test-backend-worker:
    runs-on: ubuntu-latest
    name: Run Cloudflare Worker Unit & Integration Tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci
        working-directory: backend

      - name: Run Backend Worker Tests
        run: npm run test:worker
        working-directory: backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLOUDINARY_NAME: ${{ secrets.CLOUDINARY_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_SECRET_KEY: ${{ secrets.CLOUDINARY_SECRET_KEY }}

  deploy-backend-worker:
    needs: test-backend-worker
    runs-on: ubuntu-latest
    name: Deploy Backend Worker to Cloudflare
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cloudflare-migration'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci
        working-directory: backend

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'backend'
